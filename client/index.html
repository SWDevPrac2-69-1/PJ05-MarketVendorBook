<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/fonts/Mitr-SemiBold.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/Anuphan-Variable.ttf" as="font" type="font/ttf" crossorigin />
    <meta name="theme-color" content="#f3f7ff" />
    <style>
      :root { color-scheme: light; background: #f3f7ff; }
      :root[data-theme="dark"] { color-scheme: dark; background: #0b1325; }
    </style>
    <script>
      (() => {
        let theme = "light";
        try {
          if (localStorage.getItem("night-market-theme") === "dark") theme = "dark";
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute(
          "content", theme === "dark" ? "#0b1325" : "#f3f7ff",
        );
      })();
    </script>
    <meta name="description" content="เลือกมุมโปรดในตลาดกลางคืน แล้วเริ่มต้นเรื่องราวร้านของคุณกับ Night Market" />
    <title>Night Market — Your space, after dark.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
